# Desarrollo con Docker. Arranque:
#
#   docker compose up --build
#
# En el primer arranque, `web` corre migraciones, crea un superusuario
# (CREATE_SUPERUSER) e importa los CSV que haya en `imports/equipment/`
# (AUTO_IMPORT_EQUIPMENT). Para volver a importar tras dejar un CSV nuevo:
#
#   docker compose run --rm importer
#
# El `.env` está pensado para correr Django en el host (POSTGRES_HOST=localhost);
# dentro de los contenedores esos hostnames se sobreescriben abajo con el
# ancla `x-django-env` (db / redis / mailpit).

x-django-env: &django-env
  # Sobreescribe los `*_HOST=localhost` del .env por los nombres de servicio.
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"

services:
  db:
    image: postgres:16-alpine
    container_name: biometric_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biometric_db}
      POSTGRES_USER: ${POSTGRES_USER:-biometric_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biometric_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biometric_user} -d ${POSTGRES_DB:-biometric_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: biometric_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: dev
    container_name: biometric_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "true"
      # Superusuario automático (dev). Cámbialo por variables reales en .env.
      CREATE_SUPERUSER: "true"
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-pabonsoftware2026@gmail.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-Admin.2026}
      # Importa los CSV de imports/equipment/ en cada arranque (idempotente).
      AUTO_IMPORT_EQUIPMENT: "true"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000

  # Carga masiva de equipos "a demanda": deja el CSV en imports/equipment/ y
  #   docker compose run --rm importer
  importer:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: dev
    profiles: ["import"]
    env_file:
      - .env
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "false"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py import_equipment --create-branch --update --partial --rows

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: dev
    container_name: biometric_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "false"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info

  # Programador de tareas periódicas (barrido diario de alertas — HU011/HU015).
  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: dev
    container_name: biometric_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "false"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    command: celery -A config beat -l info

  # UI de monitoreo de Celery (workers, tasks, colas) — http://localhost:5555
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: dev
    container_name: biometric_flower
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "false"
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    command: celery -A config flower --port=5555 --address=0.0.0.0

  # SMTP fake con UI web para ver correos en dev — http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: biometric_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
